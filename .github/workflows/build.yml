name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  YY_THUNKS_VER: 1.2.2
  VC_LTL_VER: 5.3.1

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Locate Visual Studio
      id: vs
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -property installationPath`) do (
            echo VS_PATH=%%i>> "%GITHUB_OUTPUT%"
            echo [Info] Found VS at: %%i
        )

    - name: Download YY-Thunks & VC-LTL (NuGet)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path deps | Out-Null

        # YY-Thunks: 提供 WinXP 兼容 thunk 桩对象
        $yyUrl = "https://api.nuget.org/v3-flatcontainer/yy-thunks/${{ env.YY_THUNKS_VER }}/yy-thunks.${{ env.YY_THUNKS_VER }}.nupkg"
        Write-Host "Downloading YY-Thunks ${{ env.YY_THUNKS_VER }} ..."
        Invoke-WebRequest -Uri $yyUrl -OutFile deps/yy-thunks.zip
        Expand-Archive -Path deps/yy-thunks.zip -DestinationPath deps/YY-Thunks -Force
        Remove-Item deps/yy-thunks.zip

        # VC-LTL: 静态链接 CRT，减小体积并支持 XP 子系统
        $ltlUrl = "https://api.nuget.org/v3-flatcontainer/vc-ltl/${{ env.VC_LTL_VER }}/vc-ltl.${{ env.VC_LTL_VER }}.nupkg"
        Write-Host "Downloading VC-LTL ${{ env.VC_LTL_VER }} ..."
        Invoke-WebRequest -Uri $ltlUrl -OutFile deps/vc-ltl.zip
        Expand-Archive -Path deps/vc-ltl.zip -DestinationPath deps/VC-LTL -Force
        Remove-Item deps/vc-ltl.zip

        Write-Host "`nDependencies ready."

    - name: Build x86
      shell: cmd
      run: |
        call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=x86
        if %errorlevel% neq 0 (
            echo [Error] Failed to init MSVC x86 environment.
            exit /b 1
        )
        if not exist "build\x86" mkdir "build\x86"
        if not exist "dist\x86" mkdir "dist\x86"

        rem Locate YY-Thunks obj
        set "YY_OBJ="
        for /f "delims=" %%f in ('dir /s /b "deps\YY-Thunks\YY_Thunks_for_WinXP.obj" 2^>nul') do (
            echo %%f | findstr /i "x86" >nul && set "YY_OBJ=%%f"
        )
        if defined YY_OBJ (echo [x86] YY-Thunks: %YY_OBJ%) else (echo [x86] YY-Thunks obj not found!)

        rem Locate VC-LTL paths
        set "LTL_INC="
        set "LTL_LIB="
        set "LTL_INC2="
        for /f "delims=" %%d in ('dir /s /b /ad "deps\VC-LTL\header" 2^>nul') do (
            if not defined LTL_INC set "LTL_INC=%%d"
        )
        for /f "delims=" %%d in ('dir /s /b /ad "deps\VC-LTL\5.1.2600.0" 2^>nul') do (
            if not defined LTL_LIB (
                if exist "%%d\lib\Win32" set "LTL_LIB=%%d\lib\Win32"
                if exist "%%d\lib\x86" set "LTL_LIB=%%d\lib\x86"
                if exist "%%d\header" set "LTL_INC2=%%d\header"
            )
        )

        if defined LTL_INC set "INCLUDE=%LTL_INC%;%INCLUDE%"
        if defined LTL_INC2 set "INCLUDE=%LTL_INC2%;%INCLUDE%"
        if defined LTL_LIB set "LIB=%LTL_LIB%;%LIB%"
        if defined LTL_LIB (echo [x86] VC-LTL lib: %LTL_LIB%) else (echo [x86] VC-LTL not found, using default CRT)

        rem Compile resources
        rc /nologo /c65001 /fo "build\x86\hkeyboard.res" "hkeyboard.rc"
        if %errorlevel% neq 0 exit /b %errorlevel%

        rem Compile source
        cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- /D_WIN32_WINNT=0x0501 /c "hkeyboard.cpp" /Fo"build\x86\hkeyboard.obj"
        if %errorlevel% neq 0 exit /b %errorlevel%

        rem Link (with YY-Thunks if available)
        if defined YY_OBJ (
            cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- "build\x86\hkeyboard.obj" "build\x86\hkeyboard.res" "%YY_OBJ%" /link /OUT:"dist\x86\HKeyboard_x86.exe" /SUBSYSTEM:WINDOWS,5.01 /MANIFEST:NO /CETCOMPAT:NO Comctl32.lib Shell32.lib Gdi32.lib User32.lib Advapi32.lib Imm32.lib
        ) else (
            cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- "build\x86\hkeyboard.obj" "build\x86\hkeyboard.res" /link /OUT:"dist\x86\HKeyboard_x86.exe" /SUBSYSTEM:WINDOWS,5.01 /MANIFEST:NO Comctl32.lib Shell32.lib Gdi32.lib User32.lib Advapi32.lib Imm32.lib
        )
        if %errorlevel% neq 0 exit /b %errorlevel%
        echo [x86] Build succeeded.

    - name: Build x64
      shell: cmd
      run: |
        call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=x64
        if %errorlevel% neq 0 (
            echo [Error] Failed to init MSVC x64 environment.
            exit /b 1
        )
        if not exist "build\x64" mkdir "build\x64"
        if not exist "dist\x64" mkdir "dist\x64"

        rem Locate YY-Thunks obj
        set "YY_OBJ="
        for /f "delims=" %%f in ('dir /s /b "deps\YY-Thunks\YY_Thunks_for_WinXP.obj" 2^>nul') do (
            echo %%f | findstr /i "x64" >nul && set "YY_OBJ=%%f"
        )
        if defined YY_OBJ (echo [x64] YY-Thunks: %YY_OBJ%) else (echo [x64] YY-Thunks obj not found!)

        rem Locate VC-LTL paths
        set "LTL_INC="
        set "LTL_LIB="
        set "LTL_INC2="
        for /f "delims=" %%d in ('dir /s /b /ad "deps\VC-LTL\header" 2^>nul') do (
            if not defined LTL_INC set "LTL_INC=%%d"
        )
        for /f "delims=" %%d in ('dir /s /b /ad "deps\VC-LTL\5.2.3790.0" 2^>nul') do (
            if not defined LTL_LIB (
                if exist "%%d\lib\x64" set "LTL_LIB=%%d\lib\x64"
                if exist "%%d\header" set "LTL_INC2=%%d\header"
            )
        )

        if defined LTL_INC set "INCLUDE=%LTL_INC%;%INCLUDE%"
        if defined LTL_INC2 set "INCLUDE=%LTL_INC2%;%INCLUDE%"
        if defined LTL_LIB set "LIB=%LTL_LIB%;%LIB%"
        if defined LTL_LIB (echo [x64] VC-LTL lib: %LTL_LIB%) else (echo [x64] VC-LTL not found, using default CRT)

        rem Compile resources
        rc /nologo /c65001 /fo "build\x64\hkeyboard.res" "hkeyboard.rc"
        if %errorlevel% neq 0 exit /b %errorlevel%

        rem Compile source
        cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- /D_WIN32_WINNT=0x0501 /c "hkeyboard.cpp" /Fo"build\x64\hkeyboard.obj"
        if %errorlevel% neq 0 exit /b %errorlevel%

        rem Link (with YY-Thunks if available)
        if defined YY_OBJ (
            cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- "build\x64\hkeyboard.obj" "build\x64\hkeyboard.res" "%YY_OBJ%" /link /OUT:"dist\x64\HKeyboard_x64.exe" /SUBSYSTEM:WINDOWS,5.02 /MANIFEST:NO /CETCOMPAT:NO Comctl32.lib Shell32.lib Gdi32.lib User32.lib Advapi32.lib Imm32.lib
        ) else (
            cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- "build\x64\hkeyboard.obj" "build\x64\hkeyboard.res" /link /OUT:"dist\x64\HKeyboard_x64.exe" /SUBSYSTEM:WINDOWS,5.02 /MANIFEST:NO Comctl32.lib Shell32.lib Gdi32.lib User32.lib Advapi32.lib Imm32.lib
        )
        if %errorlevel% neq 0 exit /b %errorlevel%
        echo [x64] Build succeeded.

    - name: Build arm64
      shell: cmd
      run: |
        call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=arm64
        if %errorlevel% neq 0 (
            echo [Error] Failed to init MSVC arm64 environment.
            exit /b 1
        )
        if not exist "build\arm64" mkdir "build\arm64"
        if not exist "dist\arm64" mkdir "dist\arm64"

        rem Locate YY-Thunks obj (ARM64 Windows 为 Win10+，无 XP 需求；找不到则跳过)
        set "YY_OBJ="
        for /f "delims=" %%f in ('dir /s /b "deps\YY-Thunks\YY_Thunks_for_WinXP.obj" 2^>nul') do (
            echo %%f | findstr /i "arm64" >nul && set "YY_OBJ=%%f"
        )
        if defined YY_OBJ (echo [arm64] YY-Thunks: %YY_OBJ%) else (echo [arm64] YY-Thunks obj not found, skip XP thunk)

        rem Locate VC-LTL paths
        set "LTL_INC="
        set "LTL_LIB="
        set "LTL_INC2="
        for /f "delims=" %%d in ('dir /s /b /ad "deps\VC-LTL\header" 2^>nul') do (
            if not defined LTL_INC set "LTL_INC=%%d"
        )
        for /f "delims=" %%d in ('dir /s /b /ad "deps\VC-LTL\5.2.3790.0" 2^>nul') do (
            if not defined LTL_LIB (
                if exist "%%d\lib\arm64" set "LTL_LIB=%%d\lib\arm64"
                if exist "%%d\header" set "LTL_INC2=%%d\header"
            )
        )

        if defined LTL_INC set "INCLUDE=%LTL_INC%;%INCLUDE%"
        if defined LTL_INC2 set "INCLUDE=%LTL_INC2%;%INCLUDE%"
        if defined LTL_LIB set "LIB=%LTL_LIB%;%LIB%"
        if defined LTL_LIB (echo [arm64] VC-LTL lib: %LTL_LIB%) else (echo [arm64] VC-LTL not found, using default CRT)

        rem Compile resources
        rc /nologo /c65001 /fo "build\arm64\hkeyboard.res" "hkeyboard.rc"
        if %errorlevel% neq 0 exit /b %errorlevel%

        rem Compile source
        cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- /D_WIN32_WINNT=0x0501 /c "hkeyboard.cpp" /Fo"build\arm64\hkeyboard.obj"
        if %errorlevel% neq 0 exit /b %errorlevel%

        rem Link (with YY-Thunks if available)
        if defined YY_OBJ (
            cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- "build\arm64\hkeyboard.obj" "build\arm64\hkeyboard.res" "%YY_OBJ%" /link /OUT:"dist\arm64\HKeyboard_arm64.exe" /SUBSYSTEM:WINDOWS,6.02 /MANIFEST:NO /CETCOMPAT:NO Comctl32.lib Shell32.lib Gdi32.lib User32.lib Advapi32.lib Imm32.lib
        ) else (
            cl /nologo /utf-8 /O2 /MT /D_HAS_EXCEPTIONS=0 /GR- /d2FH4- "build\arm64\hkeyboard.obj" "build\arm64\hkeyboard.res" /link /OUT:"dist\arm64\HKeyboard_arm64.exe" /SUBSYSTEM:WINDOWS,6.02 /MANIFEST:NO Comctl32.lib Shell32.lib Gdi32.lib User32.lib Advapi32.lib Imm32.lib
        )
        if %errorlevel% neq 0 exit /b %errorlevel%
        echo [arm64] Build succeeded.

    - name: Upload x86 artifact
      uses: actions/upload-artifact@v4
      with:
        name: HKeyboard_x86
        path: dist/x86/HKeyboard_x86.exe

    - name: Upload x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: HKeyboard_x64
        path: dist/x64/HKeyboard_x64.exe

    - name: Upload arm64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: HKeyboard_arm64
        path: dist/arm64/HKeyboard_arm64.exe

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/x86/HKeyboard_x86.exe
          dist/x64/HKeyboard_x64.exe
          dist/arm64/HKeyboard_arm64.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
